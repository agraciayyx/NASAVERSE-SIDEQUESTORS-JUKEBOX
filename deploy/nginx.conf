# nginx config for the self-hosted mirror of Earth Jukebox (used by deploy/docker-compose.yml).
# Serves the repository folder as a static website.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Never serve hidden files: this blocks /.git/ (the whole repo history),
    # .gitignore and similar.
    location ~ /\. {
        deny all;
        return 404;
    }

    # The NASA source frames and scripts are only needed to re-make the audio,
    # not by the website, so don't serve them.
    location ~ ^/(nightlight/frames|lightning/main|nee/main|zonal/main|deploy)/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Audio, video and images: let browsers cache them for a day.
    # nginx supports byte ranges by default, so seeking in audio and video works.
    location ~* \.(mp3|wav|mp4|webm|jpg|jpeg|png)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Smaller downloads for the page code and caption files.
    gzip on;
    gzip_types text/css application/javascript application/json;
}
