# Runs the Earth Jukebox mirror in an nginx container. Works with plain Docker or CasaOS
# (App Store -> Custom Install -> Import, then paste this file).
#
# Change the two /DATA/AppData/earth-jukebox paths if you cloned the repository somewhere else.
# The site is then on http://<server>:8080

name: earth-jukebox

services:
  earth-jukebox:
    image: nginx:1.27-alpine
    container_name: earth-jukebox
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - /DATA/AppData/earth-jukebox:/usr/share/nginx/html:ro
      - /DATA/AppData/earth-jukebox/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
